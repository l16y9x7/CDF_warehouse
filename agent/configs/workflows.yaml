# workflows.hand 仅用于没有 sku_id 的收尾推筐。
# 单件拣选与复核的工作手按商品的 SKU 配置。
# barcode_mismatch：扫码失败（未识别到 / 与预期不一致）时 STOP 停止等待确认，CONTINUE 只报错并继续入筐。
workflows:
  sorting:
    hand: RIGHT
    barcode_mismatch: CONTINUE
  review:
    hand: RIGHT

# 注意：SKU 配置（sku_id -> sku_typ, hand, name）已迁移到 configs/products.yaml
# 如需添加或修改 SKU，请编辑 products.yaml 文件
skus: {}

