[project]
name = "vision"
version = "0.1.0"
description = "Vision camera contract (:8003) and media push (:8005)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "numpy>=1.21,<2",
    "opencv-python-headless==4.11.0.86",
]

[project.optional-dependencies]
dev = [
    "imageio-ffmpeg>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision"]

[tool.uv]
package = true
