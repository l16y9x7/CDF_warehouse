# 7-point map: H1_F=H1/H12, H1_B=H2/H23, H2_F and H2_B both H3.
# Agent target_id -> retail_stations.yaml station_id.
# 商品货位格式：H<1|2>_<F|B>_L<1..5>_C<两位列号>。
# levels 必须与商品摆放表中“该货架面 + 该层”的总列数一致。
# 下列数据依据当前商品摆放表填写；摆放表变化时必须同步修改。
#
# 两点制：每面 station_ids 为 [左/一号侧, 右/二号侧]；
# point_1_slots 列出归入第一个点的全部货位；同层未列出的列归第二个点。
# 全局点号：1/2=H1正面，3/4=H1背面，5/6=H2正面，7/8=H2背面。

# 业务点 station_id 已与 Agent target_id 同名，无需再做别名映射。
# 旧名兼容（可选）：delivery_desk / restock_desk / judge_zone_1
aliases:
  delivery_desk: delivery_place
  restock_desk: replenishment_pickup
  judge_zone_1: task_boundary

