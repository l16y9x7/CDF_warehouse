# Retail stations：7 个地图巡航点。
# 点号 1–5 为货架巡检，6 为起点/交付台（含小票识别、任务判定，同一物理点），7 为补货台。
# x/y/yaw、vendor_node_id 以当前地图 XML 为准：map_packages/42_shanghai4/shanghai4.xml
# vendor_target_id：巡航模式 RCS 任务 ID；可由 scripts/sync_vendor_stations.py 从 RCS 回写。
# 单站关闭到点厘米修正：该站点下写 align_enable: false（缺省仍对齐；全局开关仍在 nav_defaults.yaml）。

map_name: shanghai4
stations:
